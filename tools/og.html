<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #111214; }
  .card { position: relative; width: 1200px; height: 630px; color: #ecede8; font-family: "Archivo", sans-serif; }
  .card > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,15,17,.94) 0%, rgba(14,15,17,.78) 40%, rgba(14,15,17,0) 70%); }
  .text { position: absolute; z-index: 1; left: 68px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 600px; }
  .text img { width: 520px; }
  h1 { font-weight: 800; font-stretch: 112%; font-size: 50px; line-height: 1.02; margin: 44px 0 0; letter-spacing: -0.01em; text-transform: uppercase; }
  p { margin: 22px 0 0; font-size: 22px; font-weight: 400; color: rgba(236,237,232,.86); }
  p b { color: #ef7a3a; font-weight: 700; }
  .bar { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0; height: 10px; background: #dd6a2c; }
</style>
</head>
<body>
  <div class="card">
    <img class="bg" src="../assets/img/hero.webp" alt="">
    <div class="text">
      <img src="../brand/logo-1-light.svg" alt="">
      <h1>HDPE welding, pipe and manhole fabrication</h1>
      <p>Lloyd Mthembu, Johannesburg. WhatsApp <b>073 468 8916</b></p>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
